name: Bootstrap repository

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".bootstrap/better-art-direction.tar.gz"
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand validated source tree
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf .bootstrap/better-art-direction.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
          chmod +x scripts/install-skill.sh scripts/validate-repo.mjs
          chmod +x skills/better-art-direction/scripts/static-audit.mjs
          chmod +x skills/better-art-direction/scripts/visual-audit.mjs

      - name: Commit repository implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No bootstrap changes to commit."
            exit 0
          fi
          git commit -m "feat: add Codex art direction skill"
          git push origin HEAD:main

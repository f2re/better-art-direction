<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Журнал наблюдений</title>
    <style>
      :root { --surface: #f7f8fa; --text: #172033; --focus: #155eef; }
      body { margin: 0; color: var(--text); background: var(--surface); font: 16px/1.5 system-ui, sans-serif; }
      main { max-width: 72rem; margin: 0 auto; padding: 2rem; }
      button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Журнал наблюдений</h1>
      <p>Проверьте сроки поступления данных и откройте запись для уточнения параметров.</p>
      <button type="button">Добавить наблюдение</button>
    </main>
  </body>
</html>
